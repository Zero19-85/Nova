# Nova workspace.
#
# Split along the line that actually exists in the system: what is *shared
# between two peers* versus what belongs to one of them.
#
#   nova-core    — protocol and identity, no Windows and no host state. STUN
#                  codec, the NDJSON envelope, certificate identity/mTLS, and
#                  the signaling-relay client. Both peers speak all of it, so
#                  neither owns it.
#   nova-server  — the host: capture, NVENC, the virtual display, pairing,
#                  GameStream, and the Echo RPC *server*. All the Windows.
#   echo-client  — Nova's native client (headless CLI for now).
#   nova-relay   — a minimal signaling relay for development. Not production
#                  infrastructure; see its own docs.
#
# The line is NOT "move echo:: into a library": `echo::rpc` is a *server* whose
# authorization reads Nova's pairing trust store, and `echo::wan`'s gathering
# loop drives `rtp.rs`'s media socket. Both are host-bound by nature. What is
# genuinely common is the wire format and the identity model — that is what
# nova-core holds.
[workspace]
members = ["nova-core", "nova-server", "echo-client", "echo-android", "nova-relay"]

# `echo-android` is a member (so `cargo check --workspace` and `cargo test
# --workspace` compile the JNI bridge on the dev box — a signature typo is
# otherwise an UnsatisfiedLinkError on a phone) but NOT a default member.
#
# The distinction is about binary size, and it is not theoretical: Cargo unifies
# features across whatever it is asked to build, so a bare `cargo build
# --release` that included echo-android would enable `nova-core/ring` alongside
# the host's `aws-lc-rs` and link *both* crypto providers into nova-server.exe.
# The host would gain a second copy of a TLS backend it never calls, which is
# exactly the kind of drift this project's footprint goal exists to prevent.
#
# So: deployment builds (`cargo build --release`) skip it, verification builds
# (`--workspace`) include it, and the Android build targets it directly with
# `cargo ndk … -p echo-android`.
default-members = ["nova-core", "nova-server", "echo-client", "nova-relay"]
resolver = "2"

# Single source of version truth for anything more than one member uses, so a
# crate can never end up compiled twice at two versions in one binary.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No default features on the TLS crates: their defaults hard-wire the
# `aws_lc_rs` provider, which builds C and assembly through cmake and is the one
# dependency that fights an Android cross-build. Each member names the provider
# it wants instead (see nova-core's [features]). `nova-server` keeps its own
# direct, default-featured rustls, so the host build is unaffected either way.
rustls = { version = "0.23.40", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false }
rustls-pki-types = "1.14.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
url = "2"
rcgen = "0.14"
socket2 = "0.5"
clap = { version = "4", features = ["derive"] }
aes-gcm = "0.10"

# Release tuning applies workspace-wide (profiles are only honoured at the
# workspace root). Unchanged from the pre-workspace values — see the comments
# there for why thin LTO and one codegen unit.
[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
