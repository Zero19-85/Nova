org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Only arm64 is built (see app/build.gradle.kts). A 32-bit phone cannot sustain
# the decode this client exists to do, and every extra ABI is another full
# cross-compile of the Rust library.
android.defaultConfig.ndk.abiFilters=arm64-v8a
